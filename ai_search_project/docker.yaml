name: django-app

services: 
  app:
    container_name: django-main
    build:
      context: .
      dockerfile: dockerfile
    image: django-image
    ports:
      - "8000:8000"
    volumes: 
      - .:/app

    networks:
      - solr_network

    environment:
      - SOLR_URL=http://solr:8983/solr 
    depends_on:
      - solr

      
  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper-main
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      # Whitelist essential commands for Solr/healthcheck monitoring
      ZOO_4LW_COMMANDS_WHITELIST: "mntr,conf,ruok"
    volumes:
      - zookeeper_data:/data
      - zookeeper_datalog:/datalog
    networks:
      - solr_network
    
  solr:
    image: solr:10.0.0
    hostname: solr
    container_name: solr-main
    restart: unless-stopped
    ports:
      - "8983:8983"
    environment:
      # Points Solr to the ZooKeeper container and internal port
      ZK_HOST: "zookeeper:2181"
    volumes:
      - solr_data:/var/solr

    depends_on:
      - zookeeper
    networks:
      - solr_network

volumes:
  zookeeper_data:
  zookeeper_datalog:
  solr_data:

networks:
  solr_network:
    driver: bridge
  