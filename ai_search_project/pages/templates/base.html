<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Powered Search</title>
    <style>
        /* Reset and base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; font-size: 14px; background: #D3D3D3; }
        a { text-decoration: none; color: #000; }
        h1 { padding-top: 24px; padding-bottom: 16px }
        h2 { padding-top: 24px; padding-bottom: 8px }
        h3 { padding-top: 24px; padding-bottom: 8px }
        li { padding-top: 12px; padding-bottom: 4px; margin-left:1.6em }
        p { padding-top: 8px; }
        /* Banner */
        .banner {
            background-color: #a9c6f5;
            color: #000;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            border-bottom-color: #000;
            border-bottom-style: solid;
            border-bottom-width: 1px;
        }
        .banner-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .banner-left svg {
            width: 40px;
            height: 40px;
        }
        .banner-title {
            font-size: 24px;
            font-weight: bold;
        }
        .banner-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .banner-right form {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .banner-right input[type="text"] {
            padding: 5px 8px;
            border: 1px solid #000;
            border-radius: 4px;
            font-size: 14px;
        }
        .banner-right button {
            padding: 5px 12px;
            background: #000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .banner-right select {
            padding: 5px 8px;
            border-radius: 4px;
            border: 1px solid #000;
            font-size: 14px;
            background: white;
        }

        /* Main content container – 65/35 */
        .content {
            display: flex;
            padding: 20px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .left-column {
            flex: 0 0 65%;
            max-width: 65%;
        }
        .right-column {
            flex: 0 0 35%;
            max-width: 35%;
        }
        .right-column iframe {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f9f9f9;
        }

        /* Navigation buttons inside content area */
        .nav-buttons {
            display: flex;
            justify-content: flex-end;
            margin: 20px 0;
        }
        .btn-next {
            background: #FFF;
            color: #000;
            padding: 8px 16px;
            border-radius: 5px;
            margin-left: 4px;
            border: 1px solid black;
            font-size: 12px;
            cursor: pointer;
            display: inline-block;
        }
        .btn-next:hover {
            background: #a9c6f5;
        }
        .btn-next.disabled {
            background: #888;
            pointer-events: none;
            border-style: solid;
            border-color: #000;
            border-width: 1px;
            border-radius: 5px;            
        }

        /* Index page styling */
        .index-content {
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
            text-align: left;
        }
        .index-content p {
            margin: 20px 0;
            line-height: 1.6;
        }
        .index-buttons {
            display: flex;
            justify-content: flex-end;
            margin: 20px 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .content { flex-direction: column; }
            .left-column, .right-column { flex: 1; max-width: 100%; }
            .banner { flex-direction: column; align-items: stretch; }
            .banner-right { justify-content: center; margin-top: 10px; }
        }
    </style>
</head>
<body>
    {% block banner %}
    <header class="banner">
        <div class="banner-left">
            <!-- Inline SVG logo -->
            {% block svg %}
                {{ block.super }}
                <!-- to be overridden -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>

    <!-- Glass Lens Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#f0fdf4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.7" />
    </linearGradient>

    <!-- Metallic/Sleek Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- AI Text Color -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>

    <!-- Inner Shadow for Lens Depth -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="5" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000000" flood-opacity="0.08" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)" />

  <!-- Main Magnifying Glass Group -->
  <g filter="url(#dropShadow)">
    <!-- Handle -->
    <g transform="rotate(-45 330 330)">
      <rect x="315" y="325" width="36" height="120" rx="18" fill="url(#handleGrad)" />
      <!-- Handle Highlight -->
      <rect x="323" y="335" width="8" height="95" rx="4" fill="#ffffff" opacity="0.25" />
    </g>

    <!-- Outer Rim -->
    <circle cx="215" cy="215" r="115" fill="url(#rimGrad)" />

    <!-- Inner Glass Base -->
    <circle cx="215" cy="215" r="98" fill="url(#lensGrad)" filter="url(#innerShadow)" />

    <!-- Glass Glare / Reflection Arc -->
    <path d="M 135 160 A 98 98 0 0 1 295 135 A 110 110 0 0 0 135 160 Z" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Centered 'AI' Typography -->
  <text x="215" y="240" 
        font-family="Arial, Helvetica, sans-serif" 
        font-weight="900" 
        font-size="86" 
        letter-spacing="4"
        fill="url(#textGrad)" 
        text-anchor="middle">AI</text>

  <!-- Subtle Accent Spark -->
  <circle cx="282" cy="148" r="5" fill="#38bdf8" opacity="0.9" />
  <circle cx="282" cy="148" r="2" fill="#ffffff" />
</svg>                
            {% endblock svg %}
            <span class="banner-title"><a href="/">AI Powered Search</a></span>
        </div>
        <div class="banner-right">
            {% comment %}{% if show_search %}{% endcomment %}
            <form method="get" action="{% url 'search' %}" target="search-iframe">
                <!-- <input type="text" name="q" placeholder="Search..." value="{{ request.GET.q|default:'' }}"> -->
                <input type="text" name="q" placeholder="Search..." value="">
                <button type="submit">Search</button>
            </form>
            <select onchange="location = this.value;">
                <option value="">Jump to...</option>
                {% for ch in chapters_range %}
                <option value="{% url 'chapter' ch %}" {% if ch == chapter_id %}selected{% endif %}>Chapter {{ ch }}</option>
                {% endfor %}
            </select>
            {% comment %}{% endif %}{% endcomment %}
        </div>
    </header>
    {% endblock banner %}

    <main>
        {% block content %}
        <!-- to be overridden -->
        {% endblock %}
    </main>
</body>
</html>
