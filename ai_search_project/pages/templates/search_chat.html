<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; font-size: 14px; background: #f9f9f9; padding: 10px; }
        h3 { margin-top: 0; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #e0e0e0; }
        .title {  font-weight: bold; }
        .snippet { color: #444; margin-top: 4px; }
        .meta { color: #718078; font-size: 12px; margin-top: 2px; }
        .no-results, .error { color: #555; }
        .error { color: #b00020; }
        em { font-weight: bold; color: #b00020; }
        textarea {
            min-height: 50px;
            max-height: 150px;
            flex: 1;
            padding: 13px 14px;
            resize: none;
            border: 1px solid #bfcfc3;
            border-radius: 12px;
            color: var(--ink);
            background: var(--panel);
            font: inherit;
        }
        button {
            align-self: stretch;
            min-width: 78px;
            padding: 0 16px;
            border: 1px solid black;
            border-radius: 5px;
            color: #fff;
            background: #f9f9f9;
            cursor: pointer;
            font-weight: 700;
        }        

    </style>
</head>
<body>
    <h3>Search AI Chat - Chapter {{ chapter_id }}</h3>

                       
    {% autoescape off %}
    {% if error %}
        <p class="error">{{ error }}</p>
    {% elif query %}
        
        {% if results %}
 
            <div class="snippet">{{ results }}</div>
            <br>
                        
        {% else %}
            <p class="no-results">The Chatbot is being coy "{{ query }}".</p>
        {% endif %}

    {% endif %}
    {% endautoescape %}


        <form method="get" action="{% url 'search' %}" >
            <!-- <textarea type="text" name="q" placeholder="Talk to the AI Legal Assistant" value="{{ request.GET.q|default:'' }}"></textarea> --> 

            <textarea type="text" name="q" id="text_query" autocapitalize="off" autocomplete="off" aria-autocomplete="inline" maxlength="8192" autofocus="true" placeholder="Ask the Legal Assistant Legal Questions" style="height: 24px;"></textarea>

            <!-- <input type="text" name="q" placeholder="Search..." value=""> 
            <button type="submit" >Search</button>-->
            
            <input type="hidden" name="chapter_id" value="{{ request.GET.chapter_id|default:chapter_id }}">
        </form> 

        <script>
          const textarea = document.getElementById('text_query');

          textarea.addEventListener('keydown', function (event) {
            // Check if Enter was pressed without the Shift key
            if (event.key === 'Enter' && !event.shiftKey) {
              // Prevent the default behavior (adding a new line)
              event.preventDefault();
              
              // Submit the form programmatically
              event.target.form.requestSubmit(); 
            }
          });
        </script>   
</body>

</html>
